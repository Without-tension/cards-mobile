<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FC Cards — Mobile</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 10px 5px;
            background: #0b0d13;
            color: #e2e8f0;
            margin: 0;
            -webkit-text-size-adjust: 100%;
        }

        .panel {
            background: #161923;
            padding: 12px;
            border-radius: 10px;
            width: 100%;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
        }

        h3 {
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 10px;
            margin: 0 0 12px 0;
            font-size: 1.15rem;
            color: #f8fafc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 6px;
            background: #1e293b;
            color: #94a3b8;
            font-weight: normal;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 6px;
            margin-bottom: 8px;
        }

        .filter-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #444;
            border-radius: 6px;
            background-color: #222634;
            color: #f8f8ff;
            font-size: 13px;
        }

        button {
            padding: 8px 12px;
            font-size: 12px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            color: white;
            white-space: nowrap;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.8; }

        .button-ps { background-color: #0097d9; color: #000; font-weight: bold; }
        .button-pc { background-color: #c8613c; color: #000; font-weight: bold; }
        .button-neutral { background-color: #334155; color: white; width: 100%; margin: 4px 0 10px 0; }
        .btn-refresh { background: linear-gradient(135deg, #2563eb, #1d4ed8); width: 100%; padding: 10px; margin-bottom: 10px; font-size: 13px; }

        .table-wrapper {
            overflow-x: auto;
            max-height: 75vh;
            border: 1px solid #2a2e37;
            border-radius: 6px;
            background: #10131c;
        }

        table { border-collapse: collapse; width: 100%; color: #f8f8ff; font-size: 12px; white-space: nowrap; }
        th, td { padding: 6px 6px; text-align: left; border-bottom: 1px solid #242938; }
        th { background-color: #000000; position: sticky; top: 0; z-index: 10; box-shadow: 0 1px 0 #333; }

        .sortable { cursor: pointer; user-select: none; }
        .sortable:hover { color: #0097d9; }

        .not-matching { background-color: #452424; color: #fca5a5; font-size: 11px; text-align: center; }
        .highlight { background-color: #4a1c1c; }
        .ps-price { color: #0097d9; font-weight: bold; }
        .pc-price { color: #f05922; font-weight: bold; }
        .ps-profit, .pc-profit { color: #77b922; font-weight: bold; }
        .pc-profit { font-style: italic; }

        .table-link { color: #f8f8ff; text-decoration: none; }
        .table-link:hover { text-decoration: underline; }

        .button-choise {
            background: linear-gradient(45deg, #0097d9, #77b922, #f05922);
            color: #000000;
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            border: none;
        }
        tr:hover { background-color: #1a2030; }
        .row-index { color: #64748b; font-size: 11px; text-align: center; }
    </style>
</head>
<body>

<div class="panel">
    <h3>
        <span>База Cards (Supabase)</span>
        <span id="card-counter" class="status-badge">Завантаження...</span>
    </h3>

    <button id="btn-reload" class="btn-refresh" onclick="loadFromSupabase()">🔄 Оновити дані з хмари</button>

    <div class="controls-grid">
        <input type="number" id="searchPSInput" placeholder="Max Price PS...">
        <button onclick="searchPS()" class="button-ps">Search PS</button>
    </div>

    <div class="controls-grid">
        <input type="number" id="searchPCInput" placeholder="Max Price PC...">
        <button onclick="searchPC()" class="button-pc">Search PC</button>
    </div>

    <button id="btn-toggle-zero" onclick="toggleZeroPrice()" class="button-neutral">Показати гравців без ціни</button>

    <div class="table-wrapper">
        <table id="playerTable">
            <thead>
            <tr>
                <th>Player</th>
                <th>PS Price</th>
                <th>PS Min Limit</th>
                <th>PS Max Limit</th>
                <th class="sortable" onclick="sortByProfit('.ps-profit', 4)" title="Сортувати">Profit max PS ↕</th>
                <th>Player Name</th>
                <th>Version</th>
                <th class="sortable" onclick="sortByProfit('.pc-profit', 7)" title="Сортувати">Profit max PC ↕</th>
                <th>PC Price</th>
                <th>PC Min Limit</th>
                <th>PC Max Limit</th>
                <th>Choice</th>
                <th>#</th>
            </tr>
            </thead>
            <tbody id="playerTableBody">
            </tbody>
        </table>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://xghmqwsachkhtugjkdpt.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_XR34vxJzLGPM6J6GIbfFPQ_ksXGl3Ei";

    let showZeroPrice = false;

    function formatNumber(num) {
        if (num === null || num === undefined) return '';
        if (num == 0) return '0';
        return parseInt(num).toLocaleString('ru-RU').replace(/,/g, ' ');
    }

    function extractInt(text) {
        if (!text) return NaN;
        let v = parseInt(text.replace(/[^\d-]/g, ''), 10);
        return isNaN(v) ? NaN : v;
    }

    async function loadFromSupabase() {
        const counter = document.getElementById('card-counter');
        const btn = document.getElementById('btn-reload');
        const tbody = document.getElementById('playerTableBody');

        counter.innerText = "Завантаження...";
        btn.disabled = true;

        try {
            // PostgREST за замовчуванням повертає до 1000 рядків, тому робимо пагінацію діапазонами
            let allRows = [];
            let from = 0;
            let step = 1000;
            let hasMore = true;

            while (hasMore) {
                let to = from + step - 1;
                let res = await fetch(`${SUPABASE_URL}/rest/v1/cards?select=*&order=player_id.asc`, {
                    headers: {
                        "apikey": SUPABASE_ANON_KEY,
                        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
                        "Range-Unit": "items",
                        "Range": `${from}-${to}`
                    }
                });

                if (!res.ok) throw new Error("Помилка Supabase API: " . res.statusText);

                let chunk = await res.json();
                allRows = allRows.concat(chunk);

                if (chunk.length < step) {
                    hasMore = false;
                } else {
                    from += step;
                }
            }

            // Групуємо записи по player_id (бо PS і PC збережені окремими рядками)
            const grouped = {};
            allRows.forEach(r => {
                if (!grouped[r.player_id]) {
                    grouped[r.player_id] = {
                        player_id: r.player_id,
                        name: r.name,
                        version: r.version,
                        link: r.link,
                        ps_price: null, ps_min: null, ps_max: null, ps_profit: null,
                        pc_price: null, pc_min: null, pc_max: null, pc_profit: null
                    };
                }
                let item = grouped[r.player_id];
                if (r.platform === 'ps') {
                    item.ps_price = r.lc_price;
                    item.ps_min = r.min_price;
                    item.ps_max = r.max_price;
                    item.ps_profit = r.profit;
                } else if (r.platform === 'pc') {
                    item.pc_price = r.lc_price;
                    item.pc_min = r.min_price;
                    item.pc_max = r.max_price;
                    item.pc_profit = r.profit;
                }
            });

            const cardsList = Object.values(grouped);
            tbody.innerHTML = '';
            showZeroPrice = false;
            document.getElementById('btn-toggle-zero').innerText = 'Показати гравців без ціни';
            document.getElementById('btn-toggle-zero').style.backgroundColor = '#334155';

            cardsList.forEach(card => {
                let tr = document.createElement('tr');
                let pName = card.name ? card.name.replace(/'/g, "\\'") : '';
                let pVers = card.version ? card.version.replace(/'/g, "\\'") : '';

                let psZero = (card.ps_price == 0 || card.ps_price === null);
                let pcZero = (card.pc_price == 0 || card.pc_price === null);
                let isZeroRow = (psZero && pcZero);

                tr.className = isZeroRow ? 'no-price-row highlight' : '';
                if (isZeroRow) { tr.style.display = 'none'; }

                tr.innerHTML = `
                    <td><a href="${card.link}" class="table-link" target="_blank">${card.player_id},</a></td>

                    ${card.ps_price !== null ? `
                        <td class="ps-price">${formatNumber(card.ps_price)}</td>
                        <td>${formatNumber(card.ps_min)}</td>
                        <td>${formatNumber(card.ps_max)}</td>
                        <td class="ps-profit">${formatNumber(card.ps_profit)}</td>
                    ` : `<td colspan="4" class="not-matching">Немає даних для PS</td>`}

                    <td><a href="${card.link}" class="table-link" target="_blank"><b>${card.name || ''}</b></a></td>
                    <td>${card.version || ''}</td>

                    ${card.pc_price !== null ? `
                        <td class="pc-profit">${formatNumber(card.pc_profit)}</td>
                        <td class="pc-price">${formatNumber(card.pc_price)}</td>
                        <td>${formatNumber(card.pc_min)}</td>
                        <td>${formatNumber(card.pc_max)}</td>
                    ` : `<td colspan="4" class="not-matching">Немає даних для PC</td>`}

                    <td><button class="button-choise" onclick="redirectToQ('${pName}', '${pVers}')">choice</button></td>
                    <td class="row-index"></td>
                `;
                tbody.appendChild(tr);
            });

            counter.innerText = `${cardsList.length} гравців`;
            updateRowNumbers();

        } catch (e) {
            alert("Помилка завантаження з Supabase: " + e.message);
            counter.innerText = "Помилка";
        } finally {
            btn.disabled = false;
        }
    }

    function toggleZeroPrice() {
        showZeroPrice = !showZeroPrice;
        const rows = document.querySelectorAll('.no-price-row');
        rows.forEach(row => {
            row.style.display = showZeroPrice ? '' : 'none';
        });
        const btn = document.getElementById('btn-toggle-zero');
        btn.innerText = showZeroPrice ? 'Сховати гравців без ціни' : 'Показати гравців без ціни';
        btn.style.backgroundColor = showZeroPrice ? '#c8613c' : '#334155';
        updateRowNumbers();
    }

    function updateRowNumbers() {
        let table = document.getElementById("playerTable");
        let tr = table.getElementsByTagName("tr");
        let rowNumber = 1;
        for (let i = 1; i < tr.length; i++) {
            if (tr[i].style.display !== 'none') {
                let td = tr[i].querySelector(".row-index");
                if (td) {
                    td.innerText = rowNumber;
                    rowNumber++;
                }
            }
        }
    }

    function sortByProfit(selector, thIndex) {
        let tbody = document.getElementById("playerTableBody");
        let rows = Array.from(tbody.rows);
        let th = document.getElementById("playerTable").rows[0].cells[thIndex];

        let dir = th.getAttribute('data-sort') === 'desc' ? 'asc' : 'desc';
        th.setAttribute('data-sort', dir);

        let activeRows = rows.filter(r => !r.classList.contains('highlight'));
        let hiddenRows = rows.filter(r => r.classList.contains('highlight'));

        activeRows.sort(function(a, b) {
            let cellA = a.querySelector(selector);
            let cellB = b.querySelector(selector);
            let va = cellA ? extractInt(cellA.innerText) : NaN;
            let vb = cellB ? extractInt(cellB.innerText) : NaN;

            if (isNaN(va) && isNaN(vb)) return 0;
            if (isNaN(va)) return 1;
            if (isNaN(vb)) return -1;
            return dir === 'desc' ? vb - va : va - vb;
        });

        tbody.innerHTML = '';
        activeRows.forEach(r => tbody.appendChild(r));
        hiddenRows.forEach(r => tbody.appendChild(r));

        updateRowNumbers();
    }

    function searchPS() {
        let input = document.getElementById("searchPSInput").value;
        let filter = extractInt(input);
        let hasFilter = !isNaN(filter) && input.trim() !== "";

        let tbody = document.getElementById("playerTableBody");
        let rows = Array.from(tbody.rows);

        let matchingPlayers = [];
        let nonMatchingPlayers = [];

        rows.forEach(row => {
            let priceCell = row.querySelector(".ps-price");
            let profitCell = row.querySelector(".ps-profit");

            if (!priceCell || !profitCell || profitCell.classList.contains("not-matching")) {
                row.classList.add("highlight");
                nonMatchingPlayers.push(row);
                return;
            }

            let psPrice = extractInt(priceCell.innerText);

            if (isNaN(psPrice) || psPrice === 0) {
                row.classList.add("highlight");
                nonMatchingPlayers.push(row);
            }
            else if (hasFilter && psPrice > filter) {
                row.classList.add("highlight");
                nonMatchingPlayers.push(row);
            }
            else {
                row.classList.remove("highlight");
                matchingPlayers.push({element: row, price: psPrice});
            }
        });

        matchingPlayers.sort((a, b) => a.price - b.price);

        nonMatchingPlayers.sort((a, b) => {
            let idA = extractInt(a.querySelector("td a") ? a.querySelector("td a").innerText : '0') || 0;
            let idB = extractInt(b.querySelector("td a") ? b.querySelector("td a").innerText : '0') || 0;
            return idA - idB;
        });

        tbody.innerHTML = '';
        matchingPlayers.forEach(player => tbody.appendChild(player.element));
        nonMatchingPlayers.forEach(row => tbody.appendChild(row));

        updateRowNumbers();
    }

    function searchPC() {
        let input = document.getElementById("searchPCInput").value;
        let filter = extractInt(input);
        let hasFilter = !isNaN(filter) && input.trim() !== "";

        let tbody = document.getElementById("playerTableBody");
        let rows = Array.from(tbody.rows);

        let matchingPlayers = [];
        let nonMatchingPlayers = [];

        rows.forEach(row => {
            let priceCell = row.querySelector(".pc-price");
            let profitCell = row.querySelector(".pc-profit");

            if (!priceCell || !profitCell || profitCell.classList.contains("not-matching")) {
                row.classList.add("highlight");
                nonMatchingPlayers.push(row);
                return;
            }

            let pcPrice = extractInt(priceCell.innerText);

            if (isNaN(pcPrice) || pcPrice === 0) {
                row.classList.add("highlight");
                nonMatchingPlayers.push(row);
            }
            else if (hasFilter && pcPrice > filter) {
                row.classList.add("highlight");
                nonMatchingPlayers.push(row);
            }
            else {
                row.classList.remove("highlight");
                matchingPlayers.push({element: row, price: pcPrice});
            }
        });

        matchingPlayers.sort((a, b) => a.price - b.price);

        nonMatchingPlayers.sort((a, b) => {
            let idA = extractInt(a.querySelector("td a") ? a.querySelector("td a").innerText : '0') || 0;
            let idB = extractInt(b.querySelector("td a") ? b.querySelector("td a").innerText : '0') || 0;
            return idA - idB;
        });

        tbody.innerHTML = '';
        matchingPlayers.forEach(player => tbody.appendChild(player.element));
        nonMatchingPlayers.forEach(row => tbody.appendChild(row));

        updateRowNumbers();
    }

    function redirectToQ(playerName, version) {
        localStorage.setItem('playerData', playerName + " - " + version);
        window.open('q.html', '_blank');
    }

    // Автозавантаження при відкритті сторінки
    window.addEventListener('DOMContentLoaded', loadFromSupabase);
</script>
</body>
</html>
